<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>AI Result</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            padding: 40px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
        }

        .result {
            margin-bottom: 20px;
            padding: 15px;
            background: #eef;
            border-left: 4px solid #007bff;
        }

        .question-text {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .answer-text {
            font-style: italic;
            margin-bottom: 10px;
        }

        .score-box {
            margin-top: 10px;
            font-weight: bold;
        }

        .total-score {
            margin-top: 30px;
            padding: 20px;
            background: #d4edda;
            text-align: center;
        }
    </style>

</head>

<body>

<div class="container">
    <h2>AI Evaluation Results</h2>
    <div id="results">Loading...</div>
    <button onclick="goBack()">Back</button>
</div>

<script>

async function evaluateAnswers() {
    try {
        const answersJSON = localStorage.getItem("answers");
        const questionsJSON = localStorage.getItem("questions");

        if (!answersJSON || !questionsJSON) {
            document.getElementById("results").innerHTML = "No data found";
            return;
        }

        const answersObj = JSON.parse(answersJSON);
        const questionsObj = JSON.parse(questionsJSON);

        let answers = [];
        let questions = [];

        for (let i = 1; i <= 10; i++) {
            answers.push(answersObj["q" + i]);
            questions.push(questionsObj["q" + i]);
        }

        // 🔥 SINGLE API CALL
        const response = await fetch("/api/evaluate", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                questions: questions,
                answers: answers
            })
        });

        const data = await response.json();

        let html = "";
        let totalScore = data.totalScore || 0;

        data.results.forEach((res, i) => {
            html += `
            <div class="result">
                <div class="question-text">${questions[i]}</div>
                <div class="answer-text">Your Answer: ${answers[i]}</div>
                <div>${res.analysis}</div>
                <div class="score-box">Score: ${res.score}/10</div>
            </div>
            `;
        });

        html += `
        <div class="total-score">
            <h3>Total Score</h3>
            <div style="font-size:30px;">${totalScore}/100</div>
        </div>
        `;

        document.getElementById("results").innerHTML = html;

    } catch (err) {
        document.getElementById("results").innerHTML = "Error: " + err.message;
    }
}

function goBack() {
    window.location.href = "App.html";
}

window.onload = evaluateAnswers;

</script>

</body>
</html>
